workflows:
  # =========================================================================
  # TIER 1: Validacao Continua & Testes Rapidos (iOS 18 Simulator)
  # =========================================================================
  serena-continuous-test:
    name: "Serena SOS - Testes Continuos (iOS 18 Simulator)"
    instance_type: mac_mini_m2
    max_build_duration: 15
    environment:
      xcode: 16.0
      cocoapods: default
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
        - pattern: 'main'
          include: false
    scripts:
      - name: "Instalar XcodeGen e Gerar Projeto Nativo"
        script: |
          which xcodegen || brew install xcodegen
          xcodegen generate

      - name: "Executar Suite Swift Testing no Simulador iOS"
        script: |
          xcodebuild test \
            -project "SerenaSOS.xcodeproj" \
            -scheme "SerenaSOS" \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=18.0" \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - build/TestResults.xcresult
      - /tmp/xcodebuild_logs/*.log

  # =========================================================================
  # TIER 2: Release & Publicacao TestFlight (Assinatura Oficial)
  # =========================================================================
  serena-ios-release:
    name: "Serena SOS - Release & TestFlight Distribution"
    instance_type: mac_mini_m2
    max_build_duration: 35
    environment:
      groups:
        - app_store_credentials
      vars:
        XCODE_PROJECT: "SerenaSOS.xcodeproj"
        XCODE_SCHEME: "SerenaSOS"
        BUNDLE_ID: "com.pnrt.serenasos"
      xcode: 16.0
      cocoapods: default
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'v*'
          include: true
          source: true
    scripts:
      - name: "Instalar XcodeGen e Gerar Projeto iOS"
        script: |
          which xcodegen || brew install xcodegen
          xcodegen generate

      - name: "Inicializar Chaveiro Temporario Isolado"
        script: |
          keychain initialize

      - name: "Provisionamento Automatico com App Store Connect API"
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles --project "$XCODE_PROJECT"

      - name: "Auto-Incremento do Numero de Build"
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" 2>/dev/null || echo 0)
          NEXT_BUILD_NUMBER=$(($LATEST_BUILD_NUMBER + 1))
          echo "Proximo build number: $NEXT_BUILD_NUMBER"
          agvtool new-version -all $NEXT_BUILD_NUMBER

      - name: "Executar Testes de Validacao Pre-Release"
        script: |
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=18.0" \
            -resultBundlePath build/ReleaseTestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: "Compilar Pacote IPA Assinado Oficial"
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ReleaseTestResults.xcresult
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
      email:
        recipients:
          - andresena30@gmail.com
        notify:
          success: true
          failure: true
